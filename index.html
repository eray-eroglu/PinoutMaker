<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/cpu.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinout Maker</title>
    <script>
      // Applies the saved theme before the page paints, so dark mode never flashes white (see src/theme.tsx)
      try {
        var t = localStorage.getItem('pinout-maker.theme');
        if (t === 'dark' || ((t === null || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
